<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectAbroad - Developer API & JWT Console</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .dev-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            max-width: 700px;
            width: 100%;
            box-shadow: var(--shadow-md);
        }
        .json-box {
            background: #0f172a;
            color: #38bdf8;
            padding: 1rem;
            border-radius: var(--radius-md);
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 1rem;
            max-height: 350px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="dev-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <div>
                <h1 style="font-size: 1.4rem; font-weight: 700;">🛠️ Developer API & JWT Console</h1>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Internal testing page for verifying Spring Boot JWT authentication APIs</p>
            </div>
            <button class="btn-secondary" onclick="window.location.href='/dashboard.html'">Back to Dashboard</button>
        </div>

        <div style="background: var(--bg-subtle); padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem;">
            <div style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Stored JWT Token</div>
            <div id="tokenDisplay" style="font-family: monospace; font-size: 0.8rem; word-break: break-all; color: var(--primary); margin-top: 0.25rem;">
                No token found
            </div>
        </div>

        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
            <button class="btn-primary" style="flex: 1;" id="callMeBtn">Call GET /api/users/me</button>
            <button class="btn-secondary" style="flex: 1;" id="testBadTokenBtn">Simulate Invalid Token</button>
        </div>

        <div id="outputContainer" style="display: none;">
            <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-main);">
                HTTP Status: <span id="statusBadge" class="badge badge-abroad">200 OK</span>
            </div>
            <pre id="jsonOutput" class="json-box"></pre>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwtToken');
        const tokenDisplay = document.getElementById('tokenDisplay');
        if (tokenDisplay) {
            tokenDisplay.innerText = token ? token : 'No JWT Token in localStorage (Please login first)';
        }

        document.getElementById('callMeBtn').addEventListener('click', () => {
            fetchApi(token);
        });

        document.getElementById('testBadTokenBtn').addEventListener('click', () => {
            fetchApi('invalid_jwt_token_sample');
        });

        async function fetchApi(jwt) {
            const container = document.getElementById('outputContainer');
            const statusBadge = document.getElementById('statusBadge');
            const jsonOutput = document.getElementById('jsonOutput');

            container.style.display = 'block';
            jsonOutput.innerText = 'Requesting GET /api/users/me...';

            try {
                const response = await fetch('/api/users/me', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${jwt}`,
                        'Content-Type': 'application/json'
                    }
                });

                statusBadge.innerText = `${response.status} ${response.statusText}`;
                statusBadge.className = response.ok ? 'badge badge-abroad' : 'badge badge-aspiring';

                const data = await response.json();
                jsonOutput.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                statusBadge.innerText = 'Network Error';
                statusBadge.className = 'badge badge-aspiring';
                jsonOutput.innerText = JSON.stringify({ error: err.message }, null, 2);
            }
        }
    </script>
</body>
</html>
